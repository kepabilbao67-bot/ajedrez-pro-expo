name: Build Android App Bundle (AAB)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release/v1
        uses: actions/checkout@v4
        with:
          ref: release/v1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify Expo authentication secret
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing. Add an Expo access token as repository secret EXPO_TOKEN; no build was attempted."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed AAB locally with existing EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "0"
        run: |
          mkdir -p build-output
          npx eas-cli@latest build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./build-output/AjedrezPro.aab

      - name: Verify AAB
        shell: bash
        run: |
          test -f ./build-output/AjedrezPro.aab
          ls -lh ./build-output/AjedrezPro.aab
          sha256sum ./build-output/AjedrezPro.aab | tee ./build-output/AjedrezPro.aab.sha256

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajedrezpro-play-aab
          path: |
            build-output/AjedrezPro.aab
            build-output/AjedrezPro.aab.sha256
          retention-days: 30
          if-no-files-found: error
